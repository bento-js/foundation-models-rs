name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build, lint and test
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: foundation-models-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: foundation-models-rs
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          components: clippy
      # `libswift_Concurrency` entered macOS at 12.0. Built below that floor,
      # the linker resolves it to the toolchain's back-deployment copy, whose
      # install name is `@rpath/libswift_Concurrency.dylib`. Build, lint and
      # test at the floor the macOS-gated features already require, so these
      # executables link the system Swift runtime in `/usr/lib/swift`.
      - run: cargo build --all-targets --all-features
        env:
          MACOSX_DEPLOYMENT_TARGET: "27.0"
      - run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          MACOSX_DEPLOYMENT_TARGET: "27.0"
      - run: cargo test --all-features
        env:
          MACOSX_DEPLOYMENT_TARGET: "27.0"
      - name: Swift bridge tests
        run: |
          sw_vers
          sdk_major="$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)"
          echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-version)"
          if [ "$sdk_major" -lt 27 ]; then
            echo "The native bridge test lane requires macOS SDK 27 or newer." >&2
            exit 1
          fi
          swift test --package-path swift-bridge \
            -Xswiftc -DFOUNDATION_MODELS_HAS_MACOS26_SDK \
            -Xswiftc -DFOUNDATION_MODELS_HAS_MACOS27_SDK

  msrv:
    name: Rust 1.82
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: foundation-models-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: foundation-models-rs
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.82.0"
      - run: cargo check --lib --all-features

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: foundation-models-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: foundation-models-rs
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - run: cargo generate-lockfile
      - run: cargo install cargo-audit --locked
      - run: cargo audit
